<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>图片</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0b;
        color: #fff;
      }

      .viewer-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        padding: 10px max(10px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        background: rgba(0, 0, 0, 0.78);
      }

      button {
        min-height: 46px;
        min-width: 92px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        font-weight: 800;
      }

      button.secondary {
        background: #27272a;
      }

      .viewer-status {
        position: fixed;
        left: 12px;
        right: 12px;
        top: max(12px, env(safe-area-inset-top));
        z-index: 3;
        display: none;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        text-align: center;
      }

      .viewer-status.is-visible {
        display: block;
      }

      .viewer-stage {
        min-height: 100vh;
        padding-bottom: 126px;
        overflow: auto;
        touch-action: pinch-zoom;
        -webkit-overflow-scrolling: touch;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        min-height: 40vh;
        object-fit: contain;
        background: #111;
        -webkit-touch-callout: default;
        user-select: auto;
      }

      img + img {
        margin-top: 12px;
      }

      .copy-panel {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 128px;
        z-index: 4;
        display: none;
        padding: 12px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.96);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
      }

      .copy-panel.is-visible {
        display: block;
      }

      .copy-panel strong {
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      .copy-panel textarea {
        width: 100%;
        min-height: 86px;
        border: 1px solid #52525b;
        border-radius: 8px;
        padding: 10px;
        background: #09090b;
        color: #fff;
        font: 0.9rem Arial, "Microsoft YaHei", sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="viewer-status" id="status"></div>
    <section class="copy-panel" id="copyPanel" aria-live="polite">
      <strong id="copyTitle">手动复制</strong>
      <textarea id="copyText" readonly></textarea>
    </section>
    <main class="viewer-stage">
      <img id="photo" alt="图片">
    </main>
    <nav class="viewer-bar" aria-label="图片操作">
      <button class="secondary" type="button" id="backButton">返回</button>
      <button type="button" id="shareButton">发送/分享</button>
      <button class="secondary" type="button" id="copyButton">复制链接</button>
      <button class="secondary" type="button" id="downloadButton">下载</button>
      <button type="button" id="rawButton">打开原图</button>
    </nav>
    <script>
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || "";
      const stage = document.querySelector(".viewer-stage");
      const photo = document.querySelector("#photo");
      const status = document.querySelector("#status");
      const copyPanel = document.querySelector("#copyPanel");
      const copyTitle = document.querySelector("#copyTitle");
      const copyText = document.querySelector("#copyText");
      let photos = [];
      try {
        photos = JSON.parse(params.get("srcs") || "[]");
      } catch {
        photos = [];
      }
      photos = Array.isArray(photos) ? photos.filter(Boolean) : [];
      if (photos.length) {
        photo.remove();
        photos.forEach((photoSrc) => {
          const image = document.createElement("img");
          image.src = photoSrc;
          image.alt = "图片";
          stage.append(image);
        });
      } else {
        photo.src = src;
      }

      document.querySelector("#backButton").addEventListener("click", () => {
        if (history.length > 1) history.back();
        else location.href = "index.html";
      });

      document.querySelector("#rawButton").addEventListener("click", () => {
        const targets = getTargets();
        if (targets[0]) location.href = targets[0];
      });

      document.querySelector("#copyButton").addEventListener("click", async () => {
        const text = getTargets().join("\n");
        if (!text) return showStatus("没有图片链接");
        if (await copyToClipboard(text)) {
          showStatus("已复制图片链接");
        } else {
          showCopyFallback("复制失败，请手动复制", text);
        }
      });

      document.querySelector("#downloadButton").addEventListener("click", () => {
        const targets = getTargets();
        if (!targets.length) return showStatus("没有图片可以下载");
        targets.forEach((target, index) => {
          const link = document.createElement("a");
          link.href = target;
          link.download = filenameFromUrl(target, index);
          link.rel = "noopener";
          document.body.append(link);
          link.click();
          link.remove();
        });
        showStatus("已触发下载；如被拦截，请点打开原图后长按保存");
      });

      document.querySelector("#shareButton").addEventListener("click", async () => {
        const targets = getTargets();
        const target = targets[0] || "";
        if (!target) return showStatus("没有图片可以分享");
        if (await shareWithSystem(target)) return;
        if (await copyToClipboard(target)) {
          showStatus("系统分享不可用，已复制链接；也可长按图片保存发送");
          return;
        }
        showCopyFallback("分享不可用，请长按图片保存或手动复制", target);
      });

      window.addEventListener("load", () => {
        if (getTargets().length) showStatus("可点发送/分享，失败时长按图片保存发送");
      });

      function getTargets() {
        return photos.length ? photos : [src].filter(Boolean);
      }

      async function shareWithSystem(target) {
        if (!navigator.share) return false;
        try {
          const file = await fetchShareFile(target);
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "图片" });
            showStatus("系统分享已打开");
            return true;
          }
        } catch {
        }
        try {
          await navigator.share({ title: "图片", url: target });
          showStatus("系统分享已打开");
          return true;
        } catch {
          return false;
        }
      }

      async function fetchShareFile(target) {
        const response = await fetch(target, { cache: "no-store" });
        if (!response.ok) return null;
        const blob = await response.blob();
        const type = blob.type || guessContentType(target);
        return new File([blob], filenameFromUrl(target, 0), { type });
      }

      async function copyToClipboard(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch {
        }
        try {
          copyText.value = text;
          copyText.removeAttribute("readonly");
          copyText.select();
          copyText.setSelectionRange(0, text.length);
          const ok = document.execCommand("copy");
          copyText.setAttribute("readonly", "readonly");
          return ok;
        } catch {
          copyText.setAttribute("readonly", "readonly");
          return false;
        }
      }

      function showCopyFallback(title, text) {
        copyTitle.textContent = title;
        copyText.value = text;
        copyPanel.classList.add("is-visible");
        copyText.focus();
        copyText.select();
        showStatus("请长按图片保存，或复制下面链接");
      }

      function filenameFromUrl(path, index) {
        const clean = String(path || "").split("?")[0].split("#")[0];
        const name = clean.split("/").pop() || `photo-${index + 1}.jpg`;
        return name.includes(".") ? name : `${name}.jpg`;
      }

      function guessContentType(path) {
        const clean = String(path || "").split("?")[0].toLowerCase();
        if (clean.endsWith(".png")) return "image/png";
        if (clean.endsWith(".webp")) return "image/webp";
        return "image/jpeg";
      }

      function showStatus(message) {
        status.textContent = message;
        status.classList.add("is-visible");
        window.setTimeout(() => status.classList.remove("is-visible"), 2400);
      }
    </script>
  </body>
</html>
