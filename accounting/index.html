<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三家公司账目</title>
  <link rel="stylesheet" href="./src/styles.css?v=v7-ui-patch-20260702">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">三家公司账目</p>
      <h1>销售成本盈亏表</h1>
    </div>
    <div class="topbar-actions">
      <div class="patch-pill" id="versionLabel">v1</div>
      <button id="topPatchButton" class="top-patch-button" type="button">更新</button>
    </div>
  </header>

  <main class="layout">
    <section class="top-filter">
      <div class="filter-block">
        <h2>年份</h2>
        <div class="year-list" id="yearList"></div>
      </div>
      <div class="filter-block wide">
        <h2>月份</h2>
        <div class="month-list" id="monthList"></div>
      </div>
    </section>

    <section class="summary-band">
      <div class="metric"><span>总销售额</span><strong id="totalRevenue">0</strong></div>
      <div class="metric"><span>总成本</span><strong id="totalCost">0</strong></div>
      <div class="metric"><span>总毛利</span><strong id="totalGross">0</strong></div>
      <div class="metric total-profit"><span id="totalNetLabel">扣开销后盈亏</span><strong id="totalNet">0</strong></div>
    </section>

    <section class="report-panel">
      <div class="report-head">
        <h2>三家公司报表</h2>
        <span id="reportYear">2026 / 6月</span>
      </div>
      <p class="report-note">按销售、成本、租金、工资扣掉开销后计算。</p>
      <div class="report-grid" id="reportGrid"></div>
    </section>

    <section class="workspace">
      <aside class="panel">
        <h2>公司</h2>
        <div class="company-list" id="companyList"></div>
        <div class="profit-loss-card" id="profitLossCard"></div>
      </aside>

      <section class="main-panel">
        <div class="toolbar">
          <div>
            <h2 id="activeTitle">公司</h2>
            <p id="activeSource"></p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>月份</th>
                <th>销售</th>
                <th>成本</th>
                <th>毛利</th>
                <th>费用</th>
                <th>扣开销后</th>
              </tr>
            </thead>
            <tbody id="monthRows"></tbody>
          </table>
        </div>
        <div class="invoice-tabs" id="invoiceCompanyTabs"></div>
        <h2 id="invoiceTitle">订单</h2>
        <div class="table-wrap small">
          <table>
            <thead><tr><th>日期</th><th>单号</th><th>数量</th><th>销售</th><th>成本</th></tr></thead>
            <tbody id="invoiceRows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="./src/app.js?v=v7-ui-patch-20260702"></script>
</body>
</html>
