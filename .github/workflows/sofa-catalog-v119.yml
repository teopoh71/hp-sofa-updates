name: Sofa Catalog 1.0.19 one-time bundle build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sofa-catalog-v119-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild and verify immutable content bundle
        run: python .sofa-build/1.0.19/build.py
      - name: Commit only the verified bundle and build metadata
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          git config user.name "Sofa Catalog Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -- sofa-catalog/releases/1.0.19/content.zip .sofa-build/1.0.19/remote-bundle-meta.json
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.sofa-build/1.0.19/remote-bundle-meta.json' 'sofa-catalog/releases/1.0.19/content.zip' | sort)"
          git commit -m "Add Sofa Catalog 1.0.19 immutable content bundle"
          git push origin HEAD:main
