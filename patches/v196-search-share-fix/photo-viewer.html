<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>图片</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0b;
        color: #fff;
      }

      .viewer-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        display: flex;
        gap: 10px;
        justify-content: center;
        padding: 10px max(10px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        background: rgba(0, 0, 0, 0.78);
      }

      button {
        min-height: 46px;
        min-width: 120px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        font-weight: 800;
      }

      button.secondary {
        background: #27272a;
      }

      .viewer-status {
        position: fixed;
        left: 12px;
        right: 12px;
        top: max(12px, env(safe-area-inset-top));
        z-index: 3;
        display: none;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        text-align: center;
      }

      .viewer-status.is-visible {
        display: block;
      }

      .viewer-stage {
        min-height: 100vh;
        padding-bottom: 76px;
        overflow: auto;
        touch-action: pinch-zoom;
        -webkit-overflow-scrolling: touch;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        min-height: 40vh;
        object-fit: contain;
        background: #111;
        -webkit-touch-callout: default;
        user-select: auto;
      }

      img + img {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="viewer-status" id="status"></div>
    <main class="viewer-stage">
      <img id="photo" alt="图片">
    </main>
    <nav class="viewer-bar" aria-label="图片操作">
      <button class="secondary" type="button" id="backButton">返回</button>
      <button type="button" id="shareButton">分享图片</button>
    </nav>
    <script>
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || "";
      const stage = document.querySelector(".viewer-stage");
      const photo = document.querySelector("#photo");
      const status = document.querySelector("#status");
      let photos = [];
      try {
        photos = JSON.parse(params.get("srcs") || "[]");
      } catch {
        photos = [];
      }
      photos = Array.isArray(photos) ? photos.filter(Boolean) : [];
      if (photos.length) {
        photo.remove();
        photos.forEach((photoSrc) => {
          const image = document.createElement("img");
          image.src = photoSrc;
          image.alt = "图片";
          stage.append(image);
        });
      } else {
        photo.src = src;
      }

      document.querySelector("#backButton").addEventListener("click", () => {
        if (history.length > 1) history.back();
        else location.href = "index.html";
      });

      document.querySelector("#shareButton").addEventListener("click", async () => {
        const targets = photos.length ? photos : [src].filter(Boolean);
        const shared = await shareTargets(targets);
        if (!shared) showStatus("系统不允许直接分享，请长按图片发送");
      });

      async function shareTargets(targets) {
        if (!navigator.share || !targets.length) return false;
        try {
          const files = [];
          for (let index = 0; index < Math.min(targets.length, 8); index += 1) {
            const response = await fetch(targets[index], { cache: "no-store" });
            if (!response.ok) throw new Error("photo download failed");
            const blob = await response.blob();
            const type = blob.type || guessContentType(targets[index]);
            const extension = type.includes("png") ? "png" : type.includes("webp") ? "webp" : "jpg";
            files.push(new File([blob], `sofa-photo-${index + 1}.${extension}`, { type }));
          }
          if (navigator.canShare?.({ files })) {
            await navigator.share({ files, title: "沙发图片" });
            return true;
          }
        } catch {
          // Fall back to URL sharing below.
        }
        try {
          await navigator.share({ title: "沙发图片", url: targets[0] });
          return true;
        } catch {
          return false;
        }
      }

      function guessContentType(path) {
        const clean = String(path || "").split("?")[0].toLowerCase();
        if (clean.endsWith(".png")) return "image/png";
        if (clean.endsWith(".webp")) return "image/webp";
        return "image/jpeg";
      }

      function showStatus(message) {
        status.textContent = message;
        status.classList.add("is-visible");
        window.setTimeout(() => status.classList.remove("is-visible"), 2400);
      }
    </script>
  </body>
</html>
