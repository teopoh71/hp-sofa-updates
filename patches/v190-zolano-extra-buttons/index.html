  <body>
    <main class="app-shell">
      <section class="top-panel">
        <div>
          <p class="eyebrow">HP 沙发系统</p>
          <h1>沙发组合报价</h1>
          <p class="top-copy">选择型号、材质和组合,显示销售价。</p>
        </div>
        <button class="icon-button" id="themeToggle" type="button" aria-label="切换颜色模式" title="切换颜色模式">
          <span aria-hidden="true">?</span>
        </button>
      </section>

      <section class="entry-panel is-collapsed" id="entryPanel" aria-label="新增沙发">
        <button class="panel-toggle" id="panelToggle" type="button">手动新增沙发</button>
        <form id="sofaForm" class="sofa-form">
          <label class="photo-picker">
            <input id="photoInput" type="file" accept="image/*">
            <span id="photoPreview" class="photo-preview">
              <span class="photo-placeholder">+</span>
            </span>
          </label>

          <div class="field-stack">
            <label>
              沙发名称
              <input id="nameInput" type="text" placeholder="例如:L形灰色沙发" required>
            </label>
            <label>
              价格
              <input id="priceInput" type="number" min="0" step="0.01" placeholder="例如:1250" required>
            </label>
            <label>
              资料
              <textarea id="detailsInput" rows="3" placeholder="尺寸、颜色、材质、备注"></textarea>
            </label>
            <button class="primary-button" type="submit">保存沙发</button>
          </div>
        </form>
      </section>

      <section class="tools-panel">
        <label class="search-box">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="搜索型号或备注">
        </label>
        <label>
          品牌
          <select id="brandFilter">
            <option value="all">全部</option>
            <option value="LE">LE</option>
            <option value="NK">NK</option>
            <option value="Zolano">Zolano</option>
            <option value="Matching">Matching</option>
            <option value="Manual">手动</option>
          </select>
        </label>
        <div class="tool-actions">
          <button id="exportButton" type="button">导出</button>
          <label class="import-button">
            导入
            <input id="importInput" type="file" accept="application/json">
          </label>
        </div>
      </section>

      <section class="summary-strip" aria-live="polite">
        <div>
          <span id="itemCount">0</span>
          <small>项目</small>
        </div>
        <div>
